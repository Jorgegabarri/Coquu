<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abriendo Coquu…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F8F1E4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 500;
    color: #2A3D33;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
  }
  .message {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: #4a5a52;
    margin-bottom: 12px;
    text-align: center;
  }
  .sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(31,46,38,0.4);
    text-align: center;
  }
  .btn-open {
    display: none;
    margin-top: 32px;
    background: #2A3D33;
    color: #F2D9A8;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .btn-open:hover { opacity: 0.85; }
  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #C97B5A;
    margin-right: 8px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }
</style>
</head>
<body>
<div class="logo">Coquu</div>
<p class="message"><span class="dot"></span>Abriendo la app…</p>
<p class="sub">Serás redirigido automáticamente</p>
<button id="btnOpen" class="btn-open" onclick="window.location.href = deepLink">Abrir Coquu</button>

<script>
  // Extraer todos los parámetros de la URL (query string y hash)
  function getParams() {
    const params = {};
    // Query string
    const query = window.location.search.slice(1);
    query.split('&').forEach(function(pair) {
      const parts = pair.split('=');
      if (parts[0]) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
    });
    // Hash fragment
    const hash = window.location.hash.slice(1);
    hash.split('&').forEach(function(pair) {
      const parts = pair.split('=');
      if (parts[0]) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
    });
    return params;
  }

  var params = getParams();
  var deepLink = 'coquu://auth/callback';

  function buildDeepLink(p) {
    var link = 'coquu://auth/callback';
    var paramStr = Object.keys(p).map(function(k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(p[k]);
    }).join('&');
    if (paramStr) link += '?' + paramStr;
    return link;
  }

  function openApp(link) {
    deepLink = link;

    // Intentar redirect automático
    window.location.href = deepLink;

    // Chrome puede bloquear el redirect automático sin gesto del usuario —
    // mostrar botón de fallback si el usuario sigue en la página tras 1.5s
    setTimeout(function() {
      var btn = document.getElementById('btnOpen');
      if (btn) btn.style.display = 'inline-block';
    }, 1500);
  }

  function openAppWithError(code) {
    openApp(buildDeepLink({ error: code, error_code: code }));
  }

  // Enlace con token_hash: verificarlo aquí y pasar a la app la sesión resultante
  function verifyTokenHash(tokenHash, type) {
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    script.onerror = function() { openAppWithError('unexpected_failure'); };
    script.onload = function() {
      var client = window.supabase.createClient(
        'https://gtznewhffyzwysilevrb.supabase.co',
        'sb_publishable_sJzlm3qkVXVt1jpnegmrGg_MA1uLf3b',
        { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
      );
      client.auth.verifyOtp({ token_hash: tokenHash, type: type })
        .then(function(res) {
          var session = res.data && res.data.session;
          if (res.error || !session) {
            openAppWithError((res.error && res.error.code) || 'access_denied');
            return;
          }
          openApp(buildDeepLink({
            access_token:  session.access_token,
            refresh_token: session.refresh_token,
            type:          type,
          }));
        })
        .catch(function() { openAppWithError('unexpected_failure'); });
    };
    document.head.appendChild(script);
  }

  if (params.token_hash && params.type) {
    verifyTokenHash(params.token_hash, params.type);
  } else {
    // Construir la URL del deep link con todos los parámetros
    openApp(buildDeepLink(params));
  }
</script>
</body>
</html>
